version: '3.8'
services:
  db:
    image: mysql:8
    container_name: campusfind_db
    restart: always
    environment:
      MYSQL_DATABASE: campusfind
      MYSQL_USER: campusfind
      MYSQL_PASSWORD: campusfind
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

volumes:
  db_data:
