name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: campusfind

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://test:test@localhost:3306/campusfind_test
      JWT_SECRET: test-jwt-secret-at-least-16-chars-long
      CLIENT_URL: http://localhost:5173
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: campusfind/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace=@campusfind/api

      - name: Run Linting
        run: npm run lint

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Build for Production
        run: npm run build
